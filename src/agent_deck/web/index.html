<!doctype html>
<!--
Agent Deck N4 Pro configuration GUI prototype.

Assumptions:
- 第一版只配置 N4 Pro 的 10 个主按键。
- N4 Pro 的 touch bar 在主键下方，4 个旋钮/LED 在 touch bar 下方横排。
- Touch bar 只作为全局虚拟面板预览，不承载按键详情。
- GUI 修改先停留在本地预览，点击保存并应用后写入 daemon runtime。

Reasoning:
- 用户需要先看到真实硬件布局，再理解每个键的用途。
- 未配置快捷动作、Agent 空槽和关闭键必须在视觉上分开。
- 当前页面读取 daemon 提供的本机 App 目录和图标，只在点击保存并应用后写入配置。
-->
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b0d10" />
    <title>Agent Deck · N4 Pro</title>
    <script>
      (() => {
        try {
          const storedTheme = localStorage.getItem("agentDeckTheme");
          const theme = storedTheme === "light" || storedTheme === "dark" ? storedTheme : "dark";
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
          document.querySelector('meta[name="theme-color"]')?.setAttribute("content", theme === "light" ? "#f4f7fb" : "#0b0d10");
        } catch (_error) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
    <link rel="stylesheet" href="/web/app.css?v=20260709-theme" />
    <link rel="stylesheet" href="/web/device.css?v=20260716-shortcut-ux3" />
    <link rel="stylesheet" href="/web/controls.css?v=20260716-shortcut-ux4" />
  </head>
  <body>
    <a class="skip-link" href="#mainWorkspace">跳到布局编辑器</a>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand-lockup">
          <img class="brand-mark" src="/assets/logo_command_core.png" alt="Agent Deck" width="30" height="30" fetchpriority="high" />
          <div class="brand-name">Agent Deck</div>
        </div>
        <div class="device-pill" aria-live="polite">
          <span id="deviceDot" class="status-dot"></span>
          <span id="deviceState">N4 Pro · 检查中</span>
        </div>
        <button id="themeToggle" class="theme-toggle header-theme-toggle" type="button" aria-pressed="false" aria-label="切换到亮色主题" title="切换主题">
          <span id="themeToggleIcon" class="theme-toggle-icon" aria-hidden="true">☀</span>
        </button>
        <div class="top-actions">
          <div class="top-statuses" aria-live="polite">
            <span id="syncState" class="status-chip">检查中</span>
          </div>
          <button id="saveButton" class="primary-button" type="button" disabled>保存并应用</button>
        </div>
      </header>

      <main id="mainWorkspace" class="workspace">
        <section class="stage" aria-label="N4 Pro 布局预览">
          <div class="device-wrap">
            <div class="n4-pro" data-device-profile="mirabox.n4pro">
              <div class="device-label">N4 Pro</div>
              <div id="keyGrid" class="key-grid"></div>
              <div class="touchbar">
                <img src="/assets/n4pro_splash_command_core.png" alt="Agent Deck touch bar brand panel" width="800" height="480" fetchpriority="high" />
              </div>
              <div id="knobStrip" class="knob-strip" aria-label="N4 Pro 旋钮配置">
                <button class="knob-cell" type="button" data-knob="knob_1" aria-label="旋钮 1"><span class="knob"></span><span class="led"></span></button>
                <button class="knob-cell" type="button" data-knob="knob_2" aria-label="旋钮 2"><span class="knob"></span><span class="led"></span></button>
                <button class="knob-cell" type="button" data-knob="knob_3" aria-label="旋钮 3"><span class="knob"></span><span class="led"></span></button>
                <button class="knob-cell" type="button" data-knob="knob_4" aria-label="旋钮 4"><span class="knob"></span><span class="led"></span></button>
              </div>
              <button id="lightingControl" class="lighting-control" type="button" aria-label="旋钮灯圈灯光设置">旋钮灯光</button>
            </div>
          </div>
        </section>

        <aside class="inspector" aria-label="按键配置">
          <div class="inspector-head">
            <p id="selectedEyebrow" class="eyebrow">Key 1</p>
            <h1 id="selectedTitle" class="inspector-title">未设置快捷动作</h1>
            <p id="selectedSubtitle" class="inspector-subtitle">选择这个键的用途。修改只会更新预览。</p>
          </div>
          <div id="inspectorBody" class="inspector-body"></div>
        </aside>
      </main>

      <footer class="bottom-bar">
        <div class="runtime-line">
          <span id="rendererState">renderer: unknown</span>
          <span id="agentState">agents: 0</span>
          <span id="panelState">panel: brand</span>
        </div>
        <div id="toast" class="toast" aria-live="polite"></div>
      </footer>
    </div>

    <div id="appModal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="appModalTitle">
      <div class="modal">
        <div class="modal-head">
          <h2 id="appModalTitle" class="modal-title">选择 App</h2>
          <button id="closeAppModal" class="close-button" type="button" aria-label="关闭">×</button>
        </div>
        <div class="modal-tools">
          <input id="appSearch" class="app-search" type="search" autocomplete="off" placeholder="搜索 App" aria-label="搜索 App" />
          <button id="refreshApps" class="icon-button" type="button" title="刷新 App 图标" aria-label="刷新 App 图标">↻</button>
          <span id="appCount" class="app-count">0 个 App</span>
        </div>
        <div id="appList" class="app-list"></div>
      </div>
    </div>

    <script src="/web/app.js?v=20260716-shortcut-ux3"></script>
  </body>
</html>
