[project]
name = "agent-deck"
version = "0.1.0"
description = "Local hardware console bridge for AI agent status and actions."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.28.0",
  "pillow>=10.0.0",
  "pydantic>=2.7.0",
  "streamdock>=0.1.2,<0.2.0",
  "typer>=0.12.0",
  "uvicorn>=0.30.0",
]

[project.scripts]
agent-deckd = "agent_deck.cli:daemon_app"
agent-deckctl = "agent_deck.cli:ctl_app"
agent-deck-codex-hook = "agent_deck.cli:codex_hook_app"

[dependency-groups]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
package = true
