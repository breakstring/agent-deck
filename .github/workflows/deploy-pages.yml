name: 部署产品视频播放页

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-pages.yml"
      - "site/**"
      - "scripts/build-pages.sh"
      - "assets/agent-deck/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 组装静态播放页
        run: bash scripts/build-pages.sh "$RUNNER_TEMP/agent-deck-pages"

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/agent-deck-pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
